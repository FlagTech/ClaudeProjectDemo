<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Focus Board</h1>
      <p class="app-subtitle">整理今天需要完成的工作。</p>
    </header>

    <section class="add-task" aria-label="新增工作項目">
      <label for="task-input" class="visually-hidden">工作內容</label>
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="輸入工作內容..."
        aria-label="工作內容"
        autocomplete="off"
      >
      <button type="button" id="add-button" class="btn btn-primary">新增</button>
    </section>

    <section class="stats" aria-label="工作統計">
      <div class="stat-item">
        <span class="stat-label">全部</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">未完成</span>
        <span class="stat-value" id="stat-active">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">已完成</span>
        <span class="stat-value" id="stat-completed">0</span>
      </div>
    </section>

    <section class="task-list-section" aria-label="工作清單">
      <p id="empty-state" class="empty-state">目前沒有工作項目。</p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
